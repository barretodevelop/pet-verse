name: petverse
description: Virtual pet adoption app with co-parenting
publish_to: 'none'
version: 1.0.0+1
organization: com.barreto.dev 

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
    
  # Firebase
  firebase_core: ^2.24.2
  firebase_auth: ^4.16.0
  cloud_firestore: ^4.14.0
  firebase_database: ^10.4.0
  
  # Google Sign In
  google_sign_in: ^6.2.1
  
  # State Management & Routing
  flutter_riverpod: ^2.4.9
  go_router: ^13.2.0
  
  # Models & Data
  equatable: ^2.0.5  # Para comparação de objetos
  
  # Utils
  intl: ^0.18.1
  uuid: ^4.2.2
  
  # Game Engine
  flame: ^1.14.0
  
  # Storage
  shared_preferences: ^2.2.2

  # Notificações
  flutter_local_notifications: ^19.2.1
  
  # UI
  shimmer: ^3.0.0
  flutter_animate: ^4.3.0
  google_fonts: ^6.2.1
  firebase_analytics: ^10.10.7
  flutter_svg: ^2.1.0
  share_plus: ^11.0.0
  flutter_screenutil: ^5.9.3
  lottie: ^3.3.1
  riverpod_annotation: ^2.6.1
  hooks_riverpod: ^2.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  
  # Testing 
  # mockito: ^5.4.6
  # fake_cloud_firestore: ^3.1.0

# Para garantir versões consistentes
 
# dependency_overrides:
#   analyzer: ^7.4.5 # A última versão na série 7.x que de fato existe
#   analyzer_plugin: ^0.13.0 # A última versão estável do analyzer_plugin 

