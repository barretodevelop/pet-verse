name: petverse
description: Virtual pet adoption app with co-parenting
publish_to: 'none'
version: 1.0.0+1
organization: com.barreto.dev 

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
 
  # Firebase
  firebase_core: ^3.13.1
  firebase_auth: ^5.5.4
  cloud_firestore: ^5.6.8
  firebase_database: ^11.3.6
  
  # Google Sign In
  google_sign_in: ^6.2.1
  
  # State Management & Routing
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.3.3
  go_router: ^15.1.2
  
  # Code Generation
  freezed_annotation: ^3.0.0
  json_annotation: ^4.8.1
  
  # Utils
  intl: ^0.20.2
  cached_network_image: ^3.3.1
  flutter_cache_manager: ^3.3.1
  connectivity_plus: ^6.1.4
  
  # UI/UX
  flutter_animate: ^4.3.0
  shimmer: ^3.0.0
  flutter_svg: ^2.1.0
  
  # Game Engine (se for usar)
  flame: ^1.14.0
  
  # Outros
  share_plus: ^11.0.0
  path_provider: ^2.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  
  # Code Generation
  build_runner: ^2.4.7
  freezed: ^3.0.6
  json_serializable: ^6.7.1
  # riverpod_generator: ^2.3.9
  
  # Testing 
  # mockito: ^5.4.6
  # fake_cloud_firestore: ^3.1.0

# Para garantir versões consistentes 
# dependency_overrides:
 

flutter:
 
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg
 


scripts:
  watch: dart pub run build_runner watch --delete-conflicting-outputs
  build: dart pub run build_runner build --delete-conflicting-outputs
  clean: dart pub run build_runner clean