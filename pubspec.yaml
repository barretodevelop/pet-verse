name: petverse
description: Virtual pet adoption app with co-parenting
publish_to: 'none'
version: 1.0.0+1
organization: com.barreto.dev 

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
    
  # Firebase Core & Auth
  firebase_core: ^2.24.2
  firebase_auth: ^4.15.3
  cloud_firestore: ^4.13.6
  firebase_analytics: ^10.7.4
  firebase_crashlytics: ^3.4.9
  # firebase_messaging: ^14.7.10

  # Google Sign In
  google_sign_in: ^6.2.1
  # sign_in_with_apple: ^5.0.0 # Adicionado para login com Apple

  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # Navigation
  go_router: ^12.1.3

  # UI & Animation
  flutter_animate: ^4.3.0
  google_fonts: ^6.1.0
  lottie: ^2.7.0
  cached_network_image: ^3.3.0
  flutter_svg: ^2.0.9 # Para ícones SVG, se necessário
  flutter_staggered_animations: ^1.1.1 
  confetti: ^0.7.0
  animated_text_kit: ^4.2.2
  shimmer: ^3.0.0

  # Storage
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.2

  # Utilities
  intl: ^0.19.0
  http: ^1.1.2
  uuid: ^4.2.2
  connectivity_plus: ^5.0.2

  # Dev & Testing
  cupertino_icons: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code Generation
  riverpod_generator: ^2.3.9
  build_runner: ^2.4.7
  json_annotation: ^4.8.1
  json_serializable: ^6.7.1
  hive_generator: ^2.0.1

  # Linting
  flutter_lints: ^3.0.1
  very_good_analysis: ^5.1.0

  # Testing
  mockito: ^5.4.4
  fake_async: ^1.3.1
  flutter_driver:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true

  # Assets
  assets:
    - assets/images/
    - assets/icons/
    - assets/lottie/
    - assets/pets/
 

# scripts:
#   watch: dart pub run build_runner watch --delete-conflicting-outputs
#   build: dart pub run build_runner build --delete-conflicting-outputs
#   clean: dart pub run build_runner clean